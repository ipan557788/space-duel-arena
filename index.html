<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Space Duel Arena - Mobile Edition</title>
<style>
:root {
    --p1: #34e0ff;
    --p2: #ff5c8a;
    --enemy: #ff5c8a;
    --boss: #b042ff;
    --powerup: #ffd83a;
    --accent: #ffd83a;
}
*{box-sizing:border-box; margin:0; padding:0; user-select: none; -webkit-user-select: none;}
html, body{
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    color:#eaf6ff;
    touch-action: none;
}
#game-wrap{
    position:relative;
    width:100vw;
    height:100vh;
    display: flex;
    align-items:center;
    justify-content:center;
}
canvas{
    background: #000;
    display:block;
    width: 100%;
    height: 100%;
    object-fit: contain;
}
#hud{
    position:absolute;
    top:0; left:0; right:0;
    display: flex;
    justify-content: space-between;
    padding: 10px 15px;
    pointer-events:none;
    z-index:5;
}
.hud-box{
    background:rgba(10,14,28,0.6);
    border:1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 6px 10px;
    backdrop-filter:blur(4px);
    font-size:12px;
}
.healthbar{
    width:100px; height:8px;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    overflow:hidden;
    margin-top:3px;
}
.healthbar-fill{
    height:100%;
    width:100%;
    transition:width 0.2s ease;
}
#hud-center{ text-align:center; }
#timer{ font-size: 20px; font-weight:700; color: #ffd83a; }
#level-label{ font-size:10px; opacity:0.8; }

#notif-area{
    position:absolute;
    top:80px; left:50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction:column;
    align-items:center;
    z-index:10;
    pointer-events:none;
}
.notif{
    background:rgba(10,14,28,0.85);
    border:1px solid rgba(255,216,58,0.6);
    color:#ffd83a;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight:700;
    font-size:14px;
    opacity:0;
    animation:notifPop 2.4s ease forwards;
}
@keyframes notifPop{
    0%{opacity:0; transform: translateY(-10px) scale(0.9);}
    12%{opacity:1; transform: translateY(0) scale(1);}
    80%{opacity:1;}
    100%{opacity:0; transform: translateY(-6px) scale(0.95);}
}

/* VIRTUAL CONTROLS FOR MOBILE */
#mobile-controls {
    position: absolute;
    bottom: 20px;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 25;
    pointer-events: none;
}
.dpad {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(3, 50px);
    gap: 4px;
    pointer-events: auto;
}
.dpad-btn {
    background: rgba(52, 224, 255, 0.15);
    border: 1px solid rgba(52, 224, 255, 0.4);
    color: #fff;
    font-size: 18px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    active { background: rgba(52, 224, 255, 0.4); }
}
.action-pads {
    display: flex;
    gap: 10px;
    pointer-events: auto;
    align-items: center;
}
.action-btn {
    width: 65px; height: 65px;
    background: rgba(255, 92, 138, 0.2);
    border: 1px solid rgba(255, 92, 138, 0.5);
    color: #fff;
    border-radius: 50%;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
}
#btn-up { grid-column: 2; grid-row: 1; }
#btn-left { grid-column: 1; grid-row: 2; }
#btn-right { grid-column: 3; grid-row: 2; }
#btn-down { grid-column: 2; grid-row: 3; }

.overlay{
    position:absolute;
    inset:0;
    display: flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: radial-gradient(ellipse at center, rgba(10,16,35,0.95) 0%, rgba(0,0,0,0.99) 100%);
    z-index:30;
    text-align:center;
    padding: 20px;
    overflow-y: auto;
}
.hidden { display:none !important; }

.logo-container {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    justify-content: center;
    align-items: center;
}
.game-logo {
    width: 50px; height: 50px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid rgba(52,224,255,0.5);
}

h1.title{
    font-size: clamp(24px, 6vw, 40px);
    background: linear-gradient(90deg, #34e0ff, #ffd83a, #ff5c8a);
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
    margin-bottom: 4px;
}
.subtitle{ opacity:0.75; margin-bottom: 15px; font-size: 11px; }
.menu-btn{
    background: linear-gradient(135deg, rgba(52,224,255,0.15), rgba(255,92,138,0.15));
    border:1px solid rgba(255,255,255,0.25);
    color:#eaf6ff;
    padding: 12px 20px;
    margin:6px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    width: 100%;
    max-width: 320px;
}
.menu-btn small{ display:block; opacity:0.7; font-size:9px; margin-top:2px; }

.mute-toggle{
    position:absolute;
    top:10px; right:10px;
    z-index:40;
    background:rgba(10,14,28,0.6);
    border:1px sent rgba(255,255,255,0.2);
    color:#eaf6ff;
    border-radius:6px;
    padding: 6px 10px;
    font-size:11px;
}
</style>
</head>
<body>
<div id="game-wrap">
    <canvas id="game" width="900" height="600"></canvas>
    
    <div id="hud" class="hidden">
        <div class="hud-box" id="p1-hud-box">
            <div id="p1-title-label">PESAWAT</div>
            <div class="healthbar"><div class="healthbar-fill" id="p1-hp" style="background: var(--p1)"></div></div>
            <div id="p1-score-wrap" style="font-size:10px; margin-top:2px;">Skor: <span id="p1-score">0</span></div>
        </div>
        <div id="hud-center" class="hud-box">
            <div id="level-label">GELOMBANG 1</div>
            <div id="timer">45</div>
        </div>
        <div class="hud-box" id="p2-hud-box" style="text-align: right; display:none;">
            <div>PLAYER 2</div>
            <div class="healthbar"><div class="healthbar-fill" id="p2-hp" style="background: var(--p2)"></div></div>
        </div>
    </div>

    <!-- TOMBOL VIRTUAL HP (DPAD & TEMBAK) -->
    <div id="mobile-controls" class="hidden">
        <div class="dpad">
            <button class="dpad-btn" id="btn-up">▲</button>
            <button class="dpad-btn" id="btn-left">◀</button>
            <button class="dpad-btn" id="btn-right">▶</button>
            <button class="dpad-btn" id="btn-down">▼</button>
        </div>
        <div class="action-pads">
            <button class="action-btn" id="btn-skill" style="background: rgba(255,216,58,0.2); border-color:#ffd83a;">SKILL</button>
            <button class="action-btn" id="btn-fire">FIRE</button>
        </div>
    </div>

    <div id="notif-area"></div>
    <button class="mute-toggle" id="mute-btn">Suara: ON</button>

    <!-- MAIN MENU -->
    <div class="overlay" id="menu-overlay">
        <div class="logo-container">
            <img src="logo1.png.jpeg" alt="Logo Utama" class="game-logo" onerror="this.style.display='none'">
            <img src="logo2.png.jpeg" alt="Logo Sekolah" class="game-logo" onerror="this.style.display='none'">
            <img src="logo3.png.jpeg" alt="Logo Moko" class="game-logo" onerror="this.style.display='none'">
            <img src="logo4.png.jpeg" alt="Logo RPL" class="game-logo" onerror="this.style.display='none'">
        </div>

        <h1 class="title">SPACE DUEL ARENA</h1>
        <div class="subtitle">SMKN 1 Sanden Bantul</div>
        
        <button class="menu-btn" id="btn-solo">MODE SOLO<small>Lawan musuh, ambil power-up, & hadapi boss</small></button>
        <button class="menu-btn" id="btn-duet">MODE 2 PEMAIN<small>Duel 1 vs 1</small></button>
    </div>

    <!-- GAME OVER -->
    <div class="overlay hidden" id="gameover-overlay">
        <h1 id="result-title" class="title">PERMAINAN SELESAI</h1>
        <div id="result-detail" style="margin-bottom: 15px; font-size:13px;"></div>
        <button class="menu-btn" id="btn-restart">Main Lagi</button>
        <button class="menu-btn" id="btn-menu">Menu Utama</button>
    </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let gameMode = 'solo';
let audioCtx = null;
let muted = false;
function ensureAudio(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, dur, type='sine', vol=0.15){
    if(muted) return;
    ensureAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
}
const sfx = {
    shoot: () => beep(680, 0.08, 'square', 0.05),
    hit: () => beep(160, 0.15, 'sawtooth', 0.1),
    levelup: () => beep(440, 0.2, 'triangle', 0.12),
    explode: () => beep(90, 0.3, 'sawtooth', 0.15),
    powerup: () => beep(520, 0.15, 'sine', 0.15),
    skill: () => beep(150, 0.5, 'sawtooth', 0.2),
    lose: () => beep(220, 0.3, 'sawtooth', 0.15)
};

document.getElementById('mute-btn').addEventListener('click', (e)=>{
    muted = !muted;
    e.target.textContent = muted ? 'Suara: OFF' : 'Suara: ON';
});

const keys = {};
window.addEventListener('keydown', e=>{ keys[e.code] = true; if(e.code==='Escape') backToMenu(); });
window.addEventListener('keyup', e=> keys[e.code] = false);

// Touch Controller Bindings for Mobile
function bindTouchButton(id, codeName) {
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('touchstart', (e)=>{ e.preventDefault(); keys[codeName] = true; });
    el.addEventListener('touchend', (e)=>{ e.preventDefault(); keys[codeName] = false; });
    el.addEventListener('mousedown', (e)=>{ e.preventDefault(); keys[codeName] = true; });
    el.addEventListener('mouseup', (e)=>{ e.preventDefault(); keys[codeName] = false; });
}
bindTouchButton('btn-up', 'KeyW');
bindTouchButton('btn-down', 'KeyS');
bindTouchButton('btn-left', 'KeyA');
bindTouchButton('btn-right', 'KeyD');
bindTouchButton('btn-fire', 'Space');
bindTouchButton('btn-skill', 'KeyE');

let running = false;
let particles = [], bullets = [], enemies = [], powerUps = [];
let boss = null, enemySpawnTimer = 0;
const LEVEL_TIME = 45;
let levelTimeLeft = LEVEL_TIME, level = 1;
let p1, p2;

const starLayers = [
    {count: 50, speed: 0.5, size: 1.0, stars: []},
    {count: 30, speed: 1.0, size: 1.5, stars: []}
];
starLayers.forEach(layer=>{
    for(let i=0; i<layer.count; i++) layer.stars.push({x: Math.random()*W, y: Math.random()*H});
});
function drawBackground(){
    ctx.fillStyle = '#05050f';
    ctx.fillRect(0,0,W,H);
    starLayers.forEach(layer=>{
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        layer.stars.forEach(s=>{
            s.y += layer.speed;
            if(s.y > H) s.y = 0;
            ctx.beginPath(); ctx.arc(s.x, s.y, layer.size, 0, Math.PI*2); ctx.fill();
        });
    });
}

function makeShip(x, y, color, facing, hp=100) {
    return { x, y, color, facing, vx:0, vy:0, r:16, hp, maxHp:hp, score:0, cooldown:0, skillCooldown:0, powerUpTime:0, alive:true };
}

function resetGame(mode) {
    gameMode = mode; level = 1; levelTimeLeft = LEVEL_TIME;
    bullets = []; particles = []; enemies = []; powerUps = []; boss = null; enemySpawnTimer = 1;

    p1 = makeShip(W/2, H-120, '#34e0ff', -1, 100);
    p2 = mode === 'duet' ? makeShip(W/2, 120, '#ff5c8a', 1, 100) : null;

    document.getElementById('hud').classList.remove('hidden');
    document.getElementById('mobile-controls').classList.remove('hidden');
    document.getElementById('p2-hud-box').style.display = mode === 'duet' ? 'block' : 'none';
    running = true;
    showNotif(`GELOMBANG 1 DIMULAI`);
}

function showNotif(text) {
    const area = document.getElementById('notif-area');
    const el = document.createElement('div');
    el.className = 'notif'; el.textContent = text;
    area.appendChild(el);
    setTimeout(()=> el.remove(), 2400);
}

function spawnExplosion(x,y,color, count=15) {
    for(let i=0; i<count; i++){
        const ang = Math.random() * Math.PI * 2, spd = 1 + Math.random()*3;
        particles.push({x, y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd, life:1, decay:0.03, size:2+Math.random()*2, color});
    }
}

function drawShip(ship){
    if(!ship || !ship.alive) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.rotate(ship.facing === 1 ? Math.PI/2 : -Math.PI/2);
    ctx.fillStyle = ship.color;
    ctx.beginPath();
    ctx.moveTo(18, 0); ctx.lineTo(-10, -12); ctx.lineTo(-5, 0); ctx.lineTo(-10, 12);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}

function shoot(ship, ownerId) {
    if(ship.cooldown > 0 || !ship.alive) return;
    ship.cooldown = 0.2;
    bullets.push({
        x: ship.x, y: ship.y + ship.facing*15,
        vy: ship.facing * 12, vx: 0,
        owner: ownerId, color: ship.color, r: 4
    });
    if(ownerId === 'p1') sfx.shoot();
}

function updateBullets(){
    bullets.forEach(b => { b.y += b.vy; });
    bullets = bullets.filter(b => b.y > -20 && b.y < H+20);

    bullets.forEach(b=>{
        if(b.hit) return;
        if(gameMode === 'solo' && b.owner === 'p1'){
            enemies.forEach(e => {
                if(!e.alive) return;
                if(Math.hypot(b.x - e.x, b.y - e.y) < e.r + b.r) {
                    e.hp -= 20; b.hit = true; sfx.hit();
                    if(e.hp <= 0) { e.alive = false; spawnExplosion(e.x, e.y, e.color); sfx.explode(); p1.score += 50; }
                }
            });
        }
    });
    bullets = bullets.filter(b => !b.hit);
}

const SPEED = 5;
function updatePlayers(){
    if(p1 && p1.alive) {
        let dx=0, dy=0;
        if(keys['KeyA']) dx -= 1;
        if(keys['KeyD']) dx += 1;
        if(keys['KeyW']) dy -= 1;
        if(keys['KeyS']) dy += 1;
        p1.x += dx * SPEED; p1.y += dy * SPEED;
        p1.x = Math.max(20, Math.min(W-20, p1.x));
        p1.y = Math.max(20, Math.min(H-20, p1.y));
        if(keys['Space']) shoot(p1, 'p1');
    }
}

function spawnEnemy(){
    const x = Math.random() * (W - 60) + 30;
    enemies.push({ x, y: -20, vy: 2 + (level * 0.3), color: '#ff5c8a', hp: 20, r: 16, alive: true });
}

function updateEnemies(dt) {
    if(gameMode !== 'solo') return;
    enemySpawnTimer -= dt;
    if(enemySpawnTimer <= 0){
        spawnEnemy();
        enemySpawnTimer = Math.max(0.5, 2.0 - (level * 0.2));
    }
    enemies.forEach(e => {
        e.y += e.vy;
        if(p1 && p1.alive && Math.hypot(e.x - p1.x, e.y - p1.y) < e.r + p1.r){
            p1.hp -= 25; e.alive = false; spawnExplosion(e.x, e.y, e.color); sfx.explode();
            if(p1.hp <= 0) finishGame("Misi Gagal", "Pesawatmu hancur!");
        }
    });
    enemies = enemies.filter(e => e.alive && e.y < H + 30);
}

let lastTime = performance.now();
function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    drawBackground();
    if(running){
        if(p1) p1.cooldown = Math.max(0, p1.cooldown - dt);
        updatePlayers();
        updateEnemies(dt);
        updateBullets();
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.03; });
        particles = particles.filter(p => p.life > 0);

        levelTimeLeft -= dt;
        if(levelTimeLeft <= 0) { level++; levelTimeLeft = LEVEL_TIME; showNotif(`GELOMBANG ${level}`); sfx.levelup(); }
        
        document.getElementById('p1-hp').style.width = Math.max(p1.hp, 0) + '%';
        document.getElementById('p1-score').textContent = p1.score;
        document.getElementById('timer').textContent = Math.ceil(levelTimeLeft);
        document.getElementById('level-label').textContent = `GELOMBANG ${level}`;
    }

    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    });
    if(p1) drawShip(p1);
    enemies.forEach(e => drawShip(e));
    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
    });

    requestAnimationFrame(loop);
}

function finishGame(title, detail){
    running = false;
    document.getElementById('gameover-overlay').classList.remove('hidden');
    document.getElementById('result-title').textContent = title;
    document.getElementById('result-detail').innerHTML = `${detail}<br>Skor: <b>${p1.score}</b>`;
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('mobile-controls').classList.add('hidden');
    sfx.lose();
}

function backToMenu(){
    running = false;
    document.getElementById('menu-overlay').classList.remove('hidden');
    document.getElementById('gameover-overlay').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('mobile-controls').classList.add('hidden');
}

document.getElementById('btn-solo').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('menu-overlay').classList.add('hidden');
    resetGame('solo');
});
document.getElementById('btn-duet').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('menu-overlay').classList.add('hidden');
    resetGame('duet');
});
document.getElementById('btn-restart').addEventListener('click', ()=>{
    document.getElementById('gameover-overlay').classList.add('hidden');
    resetGame(gameMode);
});
document.getElementById('btn-menu').addEventListener('click', backToMenu);

requestAnimationFrame(loop);
</script>
</body>
</html>
